# ponytail: 2 servicii — app (Next.js standalone) + db (Postgres).
# HTTPS e terminat la Cloudflare edge (proxy ON). App ascultă direct pe 80.
services:
  app:
    build: .
    ports:
      # ponytail: 80 expus public — Cloudflare origin pe port standard.
      # UFW pe VPS permite doar de la IP-urile Cloudflare (vezi /root/setup-firewall.sh).
      - "80:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URI=postgresql://postgres:${PG_PASSWORD:-postgres}@db:5432/lescinschiro
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/public/media
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: lescinschiro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
