# ponytail: 3 servicii — app (Next.js standalone), db (Postgres), caddy (HTTPS terminator).
# Caddy obține automat certificat Let's Encrypt pentru lescinschi.ro.
services:
  app:
    build: .
    # ponytail: port 3000 expus doar intern — acces public prin Caddy pe 80/443.
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URI=postgresql://postgres:${PG_PASSWORD:-postgres}@db:5432/lescinschiro
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/public/media
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: lescinschiro
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
